<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이텀(DATUM) - 배정 DB 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            font-family: 'Malgun Gothic', sans-serif; background-color: #FFFFFF; color: #0F172A;
        }
        .capture-protect-mode { filter: blur(15px) !important; opacity: 0.1 !important; pointer-events: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-white relative">

    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-40 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-7 h-7 rounded bg-blue-600 text-white font-black flex items-center justify-center text-sm">D</div>
            <h1 class="text-base xl:text-lg font-black text-slate-900">나의 배정 DB 리스트</h1>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span id="agentNameDisplay" class="font-bold text-sm text-slate-800">로딩 중...</span>
        </div>
    </header>

    <main class="w-full p-3 xl:p-6 flex-grow overflow-x-auto pb-28">
        <div id="dbContainer" class="w-full">
            <div class="text-center py-20 text-slate-400 font-bold text-sm">데이터를 불러오는 중입니다...</div>
        </div>
    </main>

    <!-- 우측 하단 저장 버튼 -->
    <div class="fixed bottom-6 right-6 z-50">
        <button id="globalSaveBtn" onclick="saveAllChanges()" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 px-7 rounded-full shadow-lg transition flex items-center gap-2">
            <span id="globalSaveText" class="text-sm">💾 변경사항 저장</span>
        </button>
    </div>

    <script>
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxM8jHtjpXz91t6X-l54CNSoPKAVMuvpoqb3_V5V71X3r7Cx8Ah3OVvyW_fWpCc3T62vg/exec"; 
        const currentAgent = localStorage.getItem('rion_logged_user');
        let modifiedRows = new Set();

        if (!currentAgent) {
            alert('메인 홈페이지에서 로그인을 먼저 진행해주세요.');
            window.close();
        } else {
            document.getElementById('agentNameDisplay').innerText = `${currentAgent} 님`;
            loadAssignedDBs();
        }

        async function loadAssignedDBs() {
            modifiedRows.clear();
            try {
                const response = await fetch(`${GAS_WEBAPP_URL}?agent=${encodeURIComponent(currentAgent)}`);
                const data = await response.json();
                renderDBList(data);
            } catch (error) {
                document.getElementById('dbContainer').innerHTML = `<div class="text-center py-20 text-rose-500 font-bold">데이터 로드 오류</div>`;
            }
        }

        function generateStatusSelect(id, val, index) {
            return `
                <select id="${id}" onchange="markModified(${index})" class="w-full p-2 border border-slate-300 rounded-lg text-xs font-bold text-slate-800 bg-white focus:border-blue-600 focus:outline-none">
                    <option value="" ${val===''?'selected':''}>- 현황 선택 -</option>
                    <option value="부재" ${val==='부재'?'selected':''}>부재</option>
                    <option value="재통화예정" ${val==='재통화예정'?'selected':''}>재통화예정</option>
                    <option value="방문예정" ${val==='방문예정'?'selected':''}>방문예정</option>
                    <option value="상담진행" ${val==='상담진행'?'selected':''}>상담진행</option>
                    <option value="계약완료" ${val==='계약완료'?'selected':''}>계약완료</option>
                    <option value="거절" ${val==='거절'?'selected':''}>거절 (회수)</option>
                    <option value="결번/불량" ${val==='결번/불량'?'selected':''}>결번/불량 (A/S)</option>
                    <option value="본인설계사" ${val==='본인설계사'?'selected':''}>본인설계사 (A/S)</option>
                </select>
            `;
        }

        function renderDBList(dbs) {
            const container = document.getElementById('dbContainer');
            if (!dbs || dbs.length === 0) {
                container.innerHTML = "<div class='text-center py-20 text-slate-400 font-bold text-sm'>현재 배정된 DB가 없습니다.</div>";
                return;
            }

            let desktopHtml = '';
            let mobileHtml = '';

            dbs.forEach((db, index) => {
                const valStatus = db.status || '';
                const valNote = db.note || '';

                // 1. PC 뷰
                desktopHtml += `
                    <tr class="bg-white border-b border-slate-200">
                        <td class="p-2.5 border-r border-slate-200 font-bold text-slate-500">${index + 1}</td>
                        <td class="p-2.5 border-r border-slate-200">${db.assignDate || '-'}</td>
                        <td class="p-2.5 border-r border-slate-200 font-bold text-blue-600">${db.phone || '-'}</td>
                        <td class="p-2.5 border-r border-slate-200 font-bold">${db.region || '-'}</td>
                        <td class="p-2.5 border-r border-slate-200 font-black text-slate-900">${db.customerName || '-'}</td>
                        <td class="p-2.5 border-r border-slate-200">${db.sido || ''} ${db.gugun || ''} ${db.dong || ''}</td>
                        <td class="p-2.5 border-r border-slate-200">${db.birth || '-'} / ${db.gender || '-'}</td>
                        <td class="p-2.5 border-r border-slate-200 text-left whitespace-normal text-[11px]">${db.memo || '-'}</td>
                        <td class="p-2.5 border-r border-slate-200 text-[11px]">${db.assignDateTime || '-'}</td>
                        <td class="p-2.5 text-rose-600 font-bold text-[11px]">${db.timeLimit || '-'}</td>
                    </tr>
                    <tr class="border-b-2 border-slate-300 bg-slate-50/60">
                        <td colspan="10" class="p-2">
                            <input type="hidden" id="custName_${index}" value="${db.customerName}">
                            <div id="edit_area_${index}" class="flex items-center gap-3 p-1.5 rounded-lg">
                                <div class="w-[30%] flex items-center gap-2">
                                    <span class="text-xs font-bold text-slate-700 shrink-0">🎧 녹취</span>
                                    <div class="flex-grow relative overflow-hidden h-10 rounded border border-slate-300 bg-[#141414]">
                                        ${db.audioUrl ? `<iframe src="${db.audioUrl.replace('uc?export=download&id=', 'file/d/')}/preview" style="position: absolute; top: -20px; left: 0; width: 100%; height: 150px; border: none;" allow="autoplay"></iframe><div class="absolute top-0 right-0 w-[45px] h-full bg-[#141414] z-10"></div>` : `<div class="w-full h-full flex items-center justify-center bg-slate-100 text-[11px] text-slate-400">녹취 없음</div>`}
                                    </div>
                                </div>
                                <div class="w-[20%]">
                                    ${generateStatusSelect(`status_${index}`, valStatus, index)}
                                </div>
                                <div class="w-[50%]">
                                    <input type="text" id="note_${index}" value="${valNote}" onchange="markModified(${index})" placeholder="비고 (상담 메모 입력)" class="w-full p-2 border border-slate-300 rounded-lg text-xs bg-white focus:border-blue-600 focus:outline-none">
                                </div>
                            </div>
                        </td>
                    </tr>
                `;

                // 2. 모바일 뷰
                mobileHtml += `
                    <div id="m_edit_area_${index}" class="bg-white rounded-xl border border-slate-200 p-4 mb-3 shadow-sm">
                        <input type="hidden" id="m_custName_${index}" value="${db.customerName}">
                        <div class="flex justify-between items-center pb-2.5 mb-2.5 border-b border-slate-100">
                            <div>
                                <span class="text-xs font-bold text-slate-400 mr-1">#${index + 1}</span>
                                <span class="font-black text-base text-slate-900">${db.customerName || '-'}</span>
                                <span class="ml-1 text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded font-bold">${db.region || '-'}</span>
                            </div>
                            <span class="text-rose-600 font-bold text-xs">${db.timeLimit || '-'}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs mb-3 bg-slate-50 p-2.5 rounded-lg">
                            <div><span class="text-slate-400 block text-[10px]">연락처</span><a href="tel:${db.phone}" class="font-bold text-blue-600 underline">${db.phone || '-'}</a></div>
                            <div><span class="text-slate-400 block text-[10px]">생년월일/성별</span><span class="font-bold">${db.birth || '-'} / ${db.gender || '-'}</span></div>
                            <div class="col-span-2"><span class="text-slate-400 block text-[10px]">주소</span><span class="font-bold">${db.sido || ''} ${db.gugun || ''} ${db.dong || ''}</span></div>
                            <div class="col-span-2"><span class="text-slate-400 block text-[10px]">메모</span><span>${db.memo || '-'}</span></div>
                        </div>
                        <div class="space-y-2">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-slate-700 shrink-0">🎧 녹취</span>
                                <div class="flex-grow relative overflow-hidden h-10 rounded border border-slate-300 bg-[#141414]">
                                    ${db.audioUrl ? `<iframe src="${db.audioUrl.replace('uc?export=download&id=', 'file/d/')}/preview" style="position: absolute; top: -20px; left: 0; width: 100%; height: 150px; border: none;" allow="autoplay"></iframe><div class="absolute top-0 right-0 w-[45px] h-full bg-[#141414] z-10"></div>` : `<div class="w-full h-full flex items-center justify-center bg-slate-100 text-[11px] text-slate-400">녹취 없음</div>`}
                                </div>
                            </div>
                            ${generateStatusSelect(`m_status_${index}`, valStatus, index)}
                            <input type="text" id="m_note_${index}" value="${valNote}" onchange="markModified(${index})" placeholder="비고 (상담 메모 입력)" class="w-full p-2 border border-slate-300 rounded-lg text-xs bg-white">
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="hidden xl:block bg-white rounded-xl border border-slate-200 overflow-hidden">
                    <table class="w-full text-xs text-center border-collapse whitespace-nowrap">
                        <thead class="bg-slate-100 text-slate-800 border-b border-slate-200 font-bold">
                            <tr>
                                <th class="p-2.5 border-r border-slate-200 w-12">No.</th>
                                <th class="p-2.5 border-r border-slate-200">배분날짜</th>
                                <th class="p-2.5 border-r border-slate-200">전화번호</th>
                                <th class="p-2.5 border-r border-slate-200">지역</th>
                                <th class="p-2.5 border-r border-slate-200">고객명</th>
                                <th class="p-2.5 border-r border-slate-200">상세주소</th>
                                <th class="p-2.5 border-r border-slate-200">생년월일/성별</th>
                                <th class="p-2.5 border-r border-slate-200 w-64">메모</th>
                                <th class="p-2.5 border-r border-slate-200">배정일시</th>
                                <th class="p-2.5">유효기간</th>
                            </tr>
                        </thead>
                        <tbody>${desktopHtml}</tbody>
                    </table>
                </div>
                <div class="block xl:hidden">${mobileHtml}</div>
            `;
        }

        function markModified(index) {
            modifiedRows.add(index);
            const dEl = document.getElementById(`edit_area_${index}`);
            if (dEl) dEl.classList.add('bg-blue-50', 'ring-1', 'ring-blue-400');
            const mEl = document.getElementById(`m_edit_area_${index}`);
            if (mEl) mEl.classList.add('ring-2', 'ring-blue-500');
        }

        async function saveAllChanges() {
            if (modifiedRows.size === 0) { alert("변경된 내용이 없습니다."); return; }
            const btn = document.getElementById('globalSaveBtn');
            const txt = document.getElementById('globalSaveText');
            btn.disabled = true;

            const isMobile = window.innerWidth < 1280;
            const pfx = isMobile ? 'm_' : '';
            const indexes = Array.from(modifiedRows);

            for (let i = 0; i < indexes.length; i++) {
                const idx = indexes[i];
                txt.innerText = `저장 중... (${i + 1}/${indexes.length})`;
                const payload = {
                    action: "updateHyunhwang",
                    agentName: currentAgent,
                    customerName: document.getElementById(`${pfx}custName_${idx}`).value,
                    status: document.getElementById(`${pfx}status_${idx}`).value,
                    note: document.getElementById(`${pfx}note_${idx}`).value
                };
                try {
                    await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
                } catch (e) {}
            }

            alert("저장이 완료되었습니다.");
            btn.disabled = false;
            txt.innerText = "💾 변경사항 저장";
            loadAssignedDBs();
        }

        // 보안 스크립트 유지
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        window.addEventListener('blur', () => {
            if (document.activeElement && document.activeElement.tagName === 'IFRAME') return;
            document.body.classList.add('capture-protect-mode');
        });
        window.addEventListener('focus', () => document.body.classList.remove('capture-protect-mode'));
    </script>
</body>
</html>
