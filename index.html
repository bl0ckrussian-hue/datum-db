<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이텀 (DATUM) - DB 구매 및 배정 플랫폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #FFFFFF; color: #0F172A; }
        .region-checkbox:checked + label { background-color: #2563EB; color: #FFFFFF; border-color: #2563EB; font-weight: 700; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-white text-slate-900 pb-16 md:pb-0">

    <!-- 상단 헤더: 좌측 로고 / 중앙 홈 메뉴 / 우측 상단 로그인 메뉴 (박스 및 문구 제거) -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 h-16 grid grid-cols-2 md:grid-cols-3 items-center">
            
            <!-- 1. 좌측: 로고 -->
            <div class="flex items-center justify-start">
                <button onclick="switchView('main')" class="flex items-center space-x-2.5 focus:outline-none">
                    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-lg text-white">D</div>
                    <span class="font-black text-xl tracking-tight text-slate-900">DATUM</span>
                </button>
            </div>

            <!-- 2. 중앙: 홈 메뉴 -->
            <nav class="hidden md:flex items-center justify-center space-x-8 text-sm font-bold text-slate-700">
                <button onclick="switchView('main')" class="hover:text-blue-600 transition">홈</button>
                <button onclick="switchView('order')" class="hover:text-blue-600 transition">DB 구매신청</button>
                <button onclick="openDbAssign()" class="hover:text-blue-600 transition">고객정보관리</button>
            </nav>

            <!-- 3. 우측 상단: 로그인 / 아이디 찾기 / 비밀번호 찾기 / 회원가입 (네모박스 및 안내문구 없음) -->
            <div class="flex items-center justify-end">
                <!-- 비로그인 상태 -->
                <div id="loggedOutUI" class="flex items-center space-x-2 sm:space-x-2.5 text-xs">
                    <button onclick="openModal('loginModal')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3.5 py-1.5 rounded-lg transition">로그인</button>
                    <button onclick="openModal('findIdModal')" class="text-slate-600 hover:text-slate-900 hover:underline">아이디 찾기</button>
                    <span class="text-slate-300">|</span>
                    <button onclick="openModal('findPwModal')" class="text-slate-600 hover:text-slate-900 hover:underline">비밀번호 찾기</button>
                    <span class="text-slate-300">|</span>
                    <button onclick="openModal('signupModal')" class="font-bold text-blue-600 hover:underline">회원가입</button>
                </div>

                <!-- 로그인 완료 상태 -->
                <div id="loggedInUI" class="hidden flex items-center space-x-2.5 text-xs">
                    <span id="displayUserName" class="font-black text-slate-900"></span>
                    <span id="displayUserId" class="text-slate-400"></span>
                    <span id="displayUserStatus" class="font-bold text-blue-600"></span>
                    <span class="text-slate-300">|</span>
                    <button onclick="openModal('memberInfoModal')" class="text-slate-600 hover:text-slate-900 hover:underline">정보수정</button>
                    <span class="text-slate-300">|</span>
                    <button onclick="logoutUser()" class="text-slate-500 hover:text-rose-600 hover:underline">로그아웃</button>
                </div>
            </div>

        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-12 flex flex-col justify-center">

        <!-- [뷰 1: 메인 화면 - DB구매신청 & 고객정보관리 카드 중앙 배치] -->
        <div id="viewMain" class="space-y-10">
            
            <!-- 중앙 정렬된 2대 핵심 카드 -->
            <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- 1. DB 구매신청 -->
                <div onclick="switchView('order')" class="bg-white hover:bg-slate-50 rounded-2xl p-8 border-2 border-slate-200 hover:border-blue-600 cursor-
